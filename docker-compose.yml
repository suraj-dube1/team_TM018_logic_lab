services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: vault
      POSTGRES_DB: vaultrag
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d vaultrag"]
      interval: 3s
      retries: 20
    ports:
      - "5432:5432"

  api:
    build: ./backend
    env_file: .env
    environment:
      ADMIN_DB_URL: postgresql://vault:vault@db:5432/vaultrag
      APP_DB_URL: postgresql://vault_app:vault_app_pw@db:5432/vaultrag
      DATA_DIR: /data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the container reach Ollama on your laptop

volumes:
  pgdata:
